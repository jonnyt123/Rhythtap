name: Apply Song Fail Mechanic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-song-fail.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply song fail mechanic
        run: |
          python3 scripts/apply-song-fail-mechanic.py
          python3 scripts/fix-song-fail-stability.py
      - name: Verify production build
        run: npm ci && npm run build
        env:
          VITE_RHYTHTAP_BUILD: ${{ github.sha }}
          VITE_STRIPE_BILLING_ENV: test
      - name: Run focused song fail tests
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          export PATH="$HOME/.deno/bin:$PATH"
          deno test --allow-read tests/song-fail.test.ts tests/game-preroll.test.ts tests/input-timing.test.ts tests/dense-note-matcher.test.ts
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Tap Tap style song failure mechanic'
          git push

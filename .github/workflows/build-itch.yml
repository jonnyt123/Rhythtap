name: Build itch.io Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/build-itch.yml'

permissions:
  contents: read

jobs:
  build-itch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build itch.io package
        run: npm run build:itch
        env:
          VITE_RHYTHTAP_BUILD: ${{ github.sha }}
          VITE_STRIPE_BILLING_ENV: live

      - name: Verify ZIP integrity
        run: unzip -t artifacts/rhythmtap-itch.zip

      - name: Upload itch.io package
        uses: actions/upload-artifact@v4
        with:
          name: rhythmtap-itch
          path: artifacts/rhythmtap-itch.zip
          if-no-files-found: error
          retention-days: 30

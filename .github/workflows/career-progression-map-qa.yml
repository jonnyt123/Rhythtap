name: Career Progression Map QA

on:
  push:
    branches: [feature/career-progression-map]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          VITE_RHYTHTAP_BUILD: ${{ github.sha }}
          VITE_STRIPE_BILLING_ENV: test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Full release regression gate
        run: npm run test:regression
      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/rhythtap-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/Rhythtap/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rhythtap-preview.log
          exit 1
      - name: Verify career map flow and mobile layout
        run: |
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';

          const starter=['voltage','sickness','never-left','fly-eagle'];
          const allMastery=(song)=>[
            `${song}:ANY:first-clear`,
            ...['EASY','NORMAL','HARD'].flatMap(d=>[`${song}:${d}:s-rank`,`${song}:${d}:full-combo`])
          ];

          const browser=await chromium.launch({headless:true});

          const openCareer=async(page,economy)=>{
            await page.goto('http://127.0.0.1:4173/Rhythtap/',{waitUntil:'networkidle'});
            await page.evaluate(({economy})=>{
              localStorage.setItem('rhythtap-tutorial-seen','1');
              localStorage.setItem('rhythtap-tutorial-complete-v1','1');
              localStorage.setItem('rhythtap-song-economy-v1',JSON.stringify(economy));
            },{economy});
            await page.reload({waitUntil:'networkidle'});
            const tutorial=page.locator('.tutorial-screen');
            if(await tutorial.count())await page.getByRole('button',{name:'Exit tutorial'}).click();
            await page.locator('.metal-home').waitFor();
            await page.locator('.metal-menu-achievements').click();
            await page.getByRole('heading',{name:'ACHIEVEMENTS'}).waitFor();
            await page.locator('.achievement-career-map').click();
            await page.getByRole('heading',{name:'CAREER MAP'}).waitFor();
          };

          for(const viewport of [{width:390,height:844},{width:844,height:390}]){
            const page=await browser.newPage({viewport,isMobile:viewport.width<500,hasTouch:true});
            await openCareer(page,{
              version:1,coins:725,unlockedSongIds:starter,
              coinMilestones:['voltage:ANY:first-clear','voltage:EASY:s-rank']
            });
            for(const text of ['RECOMMENDED NEXT','MASTER THE SETLIST','Midnight Voltage','EASY FULL COMBO']){
              if(!(await page.getByText(text,{exact:false}).count()))throw new Error('Missing career map content: '+text+' at '+JSON.stringify(viewport));
            }
            const metrics=await page.evaluate(()=>({
              innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              bodyWidth:document.body.scrollWidth,
              screenWidth:document.querySelector('.career-map')?.getBoundingClientRect().width
            }));
            if(metrics.scrollWidth>metrics.innerWidth||metrics.bodyWidth>metrics.innerWidth)throw new Error('Career map horizontal overflow '+JSON.stringify({viewport,metrics}));
            if(!(metrics.screenWidth>0)||metrics.screenWidth>metrics.innerWidth)throw new Error('Career screen width invalid '+JSON.stringify({viewport,metrics}));
            await page.close();
          }

          const playPage=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await openCareer(playPage,{version:1,coins:725,unlockedSongIds:starter,coinMilestones:[]});
          const playAction=playPage.locator('.career-primary');
          if(!(await playAction.getByText('PLAY NORMAL',{exact:false}).count()))throw new Error('Expected PLAY NORMAL next action');
          await playAction.click();
          await playPage.getByRole('heading',{name:'CHOOSE A TRACK'}).waitFor();
          if(!(await playPage.getByText('Midnight Voltage',{exact:false}).count()))throw new Error('Career play action did not open the expected song');
          await playPage.close();

          const storePage=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await openCareer(storePage,{
            version:1,coins:175,unlockedSongIds:starter,
            coinMilestones:starter.flatMap(allMastery)
          });
          if(!(await storePage.getByText('Afterglow Circuit',{exact:false}).count()))throw new Error('Expected Afterglow as next locked song');
          if(!(await storePage.getByText('200 coins required',{exact:false}).count()))throw new Error('Expected real Afterglow coin price');
          const storeAction=storePage.locator('.career-primary');
          if(!(await storeAction.getByText('OPEN STORE',{exact:false}).count()))throw new Error('Expected OPEN STORE next action');
          await storeAction.click();
          await storePage.getByRole('heading',{name:'SONG STORE'}).waitFor();
          await storePage.close();

          console.log('Career progression map browser QA: PASS');
          await browser.close();
          NODE

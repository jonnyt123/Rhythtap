name: Coin Wallet Mobile Paint QA

on:
  push:
    branches: [fix/mobile-coin-stress-qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build production
        run: npm run build
      - name: Install browser QA
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/Rhythtap/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Run mobile visual paint QA with real coin stress
        run: node scripts/mobile-visual-regression.mjs
        env:
          RHYTHTAP_QA_URL: http://127.0.0.1:4173/Rhythtap/
          RHYTHTAP_QA_OUT: qa-artifacts
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coin-stress-mobile
          path: qa-artifacts/
          if-no-files-found: ignore
          retention-days: 5

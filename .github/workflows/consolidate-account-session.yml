name: Consolidate Account Session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-account-session.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Consolidate account session storage into source
        run: python3 scripts/consolidate-account-session.py
      - name: Verify production build before commit
        run: npm ci && npm run build
        env:
          VITE_STRIPE_BILLING_ENV: test
      - name: Verify removed transform has no active references
        run: '! grep -R "account-session-transform\|accountSessionTransform" vite.config.ts tests src scripts --exclude=consolidate-account-session.py'
      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate account session storage into source'
          git push

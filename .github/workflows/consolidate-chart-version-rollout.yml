name: Consolidate Chart Version Rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-chart-version-rollout.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Consolidate chart version fields into source
        run: python scripts/consolidate-chart-version-rollout.py
      - name: Verify production build before commit
        run: npm ci && npm run build
        env:
          VITE_STRIPE_BILLING_ENV: test
      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate chart version rollout into source'
          git push

name: Consolidate Dense Note Matcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-dense-note-matcher.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Consolidate matcher into production source
        run: python scripts/consolidate-dense-note-matcher.py
      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate dense note matcher into gameplay source'
          git push

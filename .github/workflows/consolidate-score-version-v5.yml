name: Consolidate Score Version V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-score-version-v5.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Consolidate score versioning into source
        run: python3 scripts/consolidate-score-version-v5.py
      - name: Verify production build before commit
        run: npm ci && npm run build
        env:
          VITE_STRIPE_BILLING_ENV: test
      - name: Verify removed transform has no active references
        run: '! grep -R "score-version-v5-transform\|scoreVersionV5Transform" vite.config.ts src scripts --exclude=consolidate-score-version-v5.py'
      - name: Commit consolidation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate score versioning into source'
          git push
# retry with the stability high-score dependency consolidated atomically

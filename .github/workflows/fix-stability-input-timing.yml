name: Fix stability input timing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-stability-input-timing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-stability-input-timing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stability-transform.ts
          git commit -m "Keep stability transform compatible with input timestamps"
          git push origin HEAD:main

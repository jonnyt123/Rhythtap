name: Menu Asset QA

on:
  push:
    branches: [ui/reference-main-menu]

permissions:
  contents: read

jobs:
  menu-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Production build
        run: npm run build
        env:
          VITE_RHYTHTAP_BUILD: ${{ github.sha }}
          VITE_STRIPE_BILLING_ENV: test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Static menu regression guards
        run: |
          deno test --allow-read tests/mobile-layout.test.ts
          deno test --allow-read tests/scrolling-regression.test.ts
          deno test --allow-read tests/death-metal-theme.test.ts
          deno test --allow-read tests/engagement-ui.test.ts
      - name: Install browser QA runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Start production preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/rhythtap-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/Rhythtap/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/rhythtap-preview.log
          exit 1
      - name: Exact viewport and navigation visual QA
        run: node scripts/mobile-visual-regression.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: menu-asset-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

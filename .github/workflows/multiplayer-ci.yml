name: Multiplayer CI

on:
  push:
    branches: [main, codex/multiplayer-score-battle, codex/authoritative-multiplayer, 'release/**']
  pull_request:
    branches: [main, ui/hard-rock-death-metal-theme]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_RHYTHTAP_BUILD: ${{ github.sha }}
          VITE_STRIPE_BILLING_ENV: test
      - name: Compile authoritative validator
        run: npx tsc supabase/functions/validate-match/validator.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --outDir .validator-ci
      - name: Run authoritative validator attacks
        run: node tests/authoritative-validator.test.mjs
      - name: Run stability regression checks
        run: node tests/stability-regressions.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run production gameplay timing checks
        run: deno test --allow-read tests/gameplay-quality.test.ts
      - name: Run chart version backward compatibility checks
        run: deno test --node-modules-dir=auto --allow-read tests/chart-version-compat.test.ts
      - name: Run chart V4 client-server parity and playability audit
        run: deno test --node-modules-dir=auto --allow-read tests/chart-quality-v4.test.ts
      - name: Run chart V5 Hard density and parity audit
        run: deno test --node-modules-dir=auto --allow-read tests/chart-quality-v5.test.ts
      - name: Run engagement UI regression guards
        run: deno test --allow-read tests/engagement-ui.test.ts
      - name: Run mobile layout regression guards
        run: deno test --allow-read tests/mobile-layout.test.ts
      - name: Run death metal theme regression guards
        run: deno test --allow-read tests/death-metal-theme.test.ts
      - name: Run PR21 commercial release hardening guards
        run: deno test --allow-read tests/pr21-release-hardening.test.ts
      - name: Run Stripe billing regression guards
        run: deno test --allow-read tests/stripe-billing.test.ts
      - name: Run Pro badge regression guards
        run: deno test --allow-read tests/pro-badge.test.ts
      - name: Check versioned chart selector
        run: deno check --node-modules-dir=auto supabase/functions/validate-match/chart-validator.ts
      - name: Check validate-match Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/validate-match/index.ts
      - name: Check record-solo Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/record-solo/index.ts
      - name: Check Stripe Checkout Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/stripe-checkout/index.ts
      - name: Check Stripe Portal Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/stripe-portal/index.ts
      - name: Check Stripe Webhook Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/stripe-webhook/index.ts

  deploy-supabase:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-supabase]'))
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: hcaawhtkldabetxzptmc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require production deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN repository secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD repository secret'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply database migrations
        run: supabase db push
      - name: Deploy validate-match Edge Function
        run: supabase functions deploy validate-match --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy record-solo Edge Function
        run: supabase functions deploy record-solo --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy Stripe Checkout Edge Function
        run: supabase functions deploy stripe-checkout --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy Stripe Portal Edge Function
        run: supabase functions deploy stripe-portal --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy Stripe Webhook Edge Function
        run: supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_ID" --use-api

name: Multiplayer CI

on:
  push:
    branches: [codex/multiplayer-score-battle, codex/authoritative-multiplayer]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compile authoritative validator
        run: npx tsc supabase/functions/validate-match/validator.ts --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --outDir .validator-ci
      - name: Run authoritative validator attacks
        run: node tests/authoritative-validator.test.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check validate-match Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/validate-match/index.ts

  deploy-supabase:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 3
    needs: build
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: hcaawhtkldabetxzptmc
      RHYTHMTAP_SITE_URL: https://jonnyt123.github.io/Rhythtap/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require production deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN repository secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD repository secret'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Apply database migrations
        run: supabase db push --yes
      - name: Configure production Auth redirect
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/config/auth"
          current="$(curl --fail --silent --show-error "$endpoint" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          existing="$(printf '%s' "$current" | jq -r '.uri_allow_list // ""')"
          merged="$(python3 - "$existing" "$RHYTHMTAP_SITE_URL" <<'PY'
import sys
existing, target = sys.argv[1], sys.argv[2]
urls = [u.strip() for u in existing.split(',') if u.strip()]
if target not in urls:
    urls.append(target)
print(','.join(urls))
PY
)"
          payload="$(jq -n --arg site "$RHYTHMTAP_SITE_URL" --arg allow "$merged" '{site_url:$site,uri_allow_list:$allow}')"
          curl --fail --silent --show-error -X PATCH "$endpoint" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" >/dev/null
      - name: Verify production Auth redirect
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/config/auth"
          current="$(curl --fail --silent --show-error "$endpoint" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")"
          printf '%s' "$current" | jq -e --arg site "$RHYTHMTAP_SITE_URL" '.site_url == $site and ((.uri_allow_list // "") | split(",") | map(gsub("^\\s+|\\s+$"; "")) | index($site) != null)' >/dev/null

name: Supabase Reconcile Deploy

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/supabase-reconcile-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: hcaawhtkldabetxzptmc
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Require production deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN repository secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD repository secret'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Show migration state before push
        run: supabase migration list
      - name: Apply all pending local migrations
        run: supabase db push --include-all
      - name: Show migration state after push
        run: supabase migration list
      - name: Deploy validate-match Edge Function
        run: supabase functions deploy validate-match --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy record-solo Edge Function
        run: supabase functions deploy record-solo --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy Stripe Checkout Edge Function
        run: supabase functions deploy stripe-checkout --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy Stripe Portal Edge Function
        run: supabase functions deploy stripe-portal --project-ref "$SUPABASE_PROJECT_ID" --use-api
      - name: Deploy Stripe Webhook Edge Function
        run: supabase functions deploy stripe-webhook --project-ref "$SUPABASE_PROJECT_ID" --use-api
